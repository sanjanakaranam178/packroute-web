name: PackRoute Selenium Automated & Load Tests (300 Test Cases + 100 VUs)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: Run Selenium Node.js Tests & 100 VU Load Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Google Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome Installation
        run: |
          google-chrome --version || chromium-browser --version || true

      - name: Install Dependencies
        working-directory: packroute
        run: npm install

      - name: Generate 300 Test Cases Excel Matrix
        working-directory: packroute
        run: npm run generate:excel

      - name: Start PackRoute Local Vite Server
        working-directory: packroute
        run: |
          npx vite --port 5173 --host 0.0.0.0 &
          sleep 4
          curl -I http://localhost:5173 || true

      - name: Execute Selenium Node.js Test Suite
        working-directory: packroute
        env:
          HEADLESS: "true"
          TEST_BASE_URL: "http://localhost:5173"
          CI: "true"
        run: npm run test:selenium

      - name: Run 100 VU Load Testing (1 Minute)
        working-directory: packroute
        env:
          VIRTUAL_USERS: "100"
          DURATION_SECONDS: "60"
          TEST_BASE_URL: "http://localhost:5173"
        run: npm run test:load

      - name: Publish Detailed Summary Report
        if: always()
        working-directory: packroute
        run: npm run publish:summary

      - name: Upload Test Artifacts (Excel & HTML Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PackRoute_Test_and_Load_Reports
          path: |
            **/*.xlsx
            **/*.html
          if-no-files-found: warn
          retention-days: 30
